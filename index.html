<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Faz o vídeo preencher a tela toda */
        }
    </style>
</head>
<body>
    <!-- O atributo 'autoplay' inicia sozinho, 'muted' é necessário para o autoplay funcionar em muitos sistemas, e 'playsinline' evita que o Android abra o player nativo em tela cheia com controles -->
    <video autoplay muted playsinline loop>
        <source src="loading.mp4" type="video/mp4">
        Seu navegador não suporta vídeos.
    </video>
</body>
</html>
