<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Pipi Loading</title>
    <style>
        /* Reset básico para garantir que ocupe a tela toda sem bordas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Estilo do vídeo para preencher a tela do celular */
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Garante que o vídeo cubra a tela sem distorcer */
        }
        /* Esconde barras de rolagem no navegador */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 
        autoplay: inicia sozinho
        muted: obrigatório para autoplay funcionar no Chrome/Android
        loop: repete infinitamente
        playsinline: impede que o Android abra o player nativo com controles
    -->
    <video autoplay muted loop playsinline id="loadingVideo">
        <source src="loading.mp4" type="video/mp4">
        Seu navegador não suporta vídeos.
    </video>

    <script>
        // Garante que o vídeo tente dar play assim que a página carregar
        window.addEventListener('load', function() {
            var v = document.getElementById('loadingVideo');
            v.play().catch(function(error) {
                console.log("Autoplay bloqueado, aguardando interação.");
            });
        });
    </script>
</body>
</html>
